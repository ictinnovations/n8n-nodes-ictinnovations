name: n8n community package scan

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published version to scan'
        required: true
        default: 'latest'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The scanner draws progress with carriage returns, which the Actions log
      # drops entirely. Translate them so failures are readable.
      - run: |
          set -o pipefail
          npx --yes @n8n/scan-community-package n8n-nodes-ictinnovations@${{ inputs.version }} 2>&1 | tr '\r' '\n'
        shell: bash
